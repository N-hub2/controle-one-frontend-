<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace garage - Controle One</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <h1 class="brand"><a href="../index.html">Controle One</a></h1>
      <nav class="top-nav" aria-label="Navigation principale">
        <a href="garage-dashboard.html">Espace centre</a>
        <a href="search.html">Vue recherche</a>
        <a href="login.html" data-logout>Déconnexion</a>
      </nav>
    </div>
  </header>

  <main class="page page-garage-dashboard container">
    <header class="garage-dashboard__header">
      <div>
        <h1>Tableau de bord centre</h1>
        <p>Suivez les réservations de votre centre et confirmez les demandes en attente.</p>
      </div>
    </header>

    <p class="garage-dashboard__state" data-garage-dashboard-state role="status">Chargement des réservations...</p>

    <section class="garage-dashboard__summary" data-garage-dashboard-summary hidden>
      <article class="card">
        <h2>Réservations</h2>
        <p data-garage-summary-count>0 réservation</p>
      </article>
      <article class="card">
        <h2>En attente</h2>
        <p data-garage-summary-pending>0 demande</p>
      </article>
    </section>

    <section class="garage-dashboard__list" data-garage-reservations-list aria-live="polite"></section>
  </main>
  <script type="module" src="../scripts/garage-dashboard.js"></script>
</body>
</html>
