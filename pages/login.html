<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Controle One</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <main class="page page-login container">
    <section class="auth-box card">
      <h1>Login</h1>
      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input id="login-email" class="input-control" type="email" required>
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input id="login-password" class="input-control" type="password" required>
        </div>
        <button type="submit" class="button primary-button">Login</button>
      </form>
      <p>No account? <a href="register.html">Register</a></p>
    </section>
  </main>
  <script src="../scripts/main.js" defer></script>
</body>
</html>
