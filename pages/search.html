<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Controle One</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <main class="page page-search container">
    <h1>Find a center</h1>

    <form class="search-form card" action="search.html" method="get">
      <div class="form-field">
        <label for="city">City</label>
        <input id="city" name="city" class="input-control" type="text" placeholder="Paris" required>
      </div>
      <div class="form-field">
        <label for="vehicle">Vehicle plate</label>
        <input id="vehicle" name="vehicle" class="input-control" type="text" placeholder="AB-123-CD" required>
      </div>
      <button type="submit" class="button primary-button">Search</button>
    </form>

    <section class="result-grid" aria-label="Center list">
      <article class="card center-card">
        <h2>Auto Bilan Paris 15</h2>
        <p>Price: 78€</p>
        <p>Slots: 09:30, 11:00, 14:00</p>
        <a class="button primary-button" href="booking.html?center=Auto%20Bilan%20Paris%2015">Book</a>
      </article>

      <article class="card center-card">
        <h2>Controle Tech Lyon Est</h2>
        <p>Price: 74€</p>
        <p>Slots: 10:00, 13:30, 16:00</p>
        <a class="button primary-button" href="booking.html?center=Controle%20Tech%20Lyon%20Est">Book</a>
      </article>

      <article class="card center-card">
        <h2>Securitest Marseille Sud</h2>
        <p>Price: 80€</p>
        <p>Slots: 08:45, 12:15, 15:30</p>
        <a class="button primary-button" href="booking.html?center=Securitest%20Marseille%20Sud">Book</a>
      </article>
    </section>
  </main>

  <script src="../scripts/main.js" defer></script>
</body>
</html>
