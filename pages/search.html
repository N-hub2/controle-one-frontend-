<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Controle One</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <main class="page page-search container">
    <h1>Find a center</h1>

    <form class="search-form card" action="search.html" method="get">
      <div class="form-field">
        <label for="city">City</label>
        <input id="city" name="city" class="input-control" type="text" placeholder="Paris" required>
      </div>
      <div class="form-field">
        <label for="vehicle">Vehicle plate</label>
        <input id="vehicle" name="vehicle" class="input-control" type="text" placeholder="AB-123-CD" required>
      </div>
      <button type="submit" class="button primary-button">Search</button>
    </form>

    <p class="search-state card" data-search-state role="status" aria-live="polite" hidden></p>

    <section class="result-grid" data-search-results aria-label="Center list"></section>
  </main>

  <script src="../scripts/main.js" defer></script>
  <script type="module" src="../scripts/search.js"></script>
</body>
</html>
