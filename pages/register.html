<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Controle One</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <main class="page page-register container">
    <section class="auth-box card">
      <h1>Register</h1>
      <form id="register-form" novalidate>
        <div class="form-field">
          <label for="register-name">Full name</label>
          <input id="register-name" name="fullName" class="input-control" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="register-email">Email</label>
          <input id="register-email" name="email" class="input-control" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="register-phone">Phone</label>
          <input id="register-phone" name="phone" class="input-control" type="tel" autocomplete="tel" required>
        </div>
        <div class="form-field">
          <label for="register-password">Password</label>
          <input id="register-password" name="password" class="input-control" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label for="register-confirm-password">Confirm password</label>
          <input id="register-confirm-password" name="confirmPassword" class="input-control" type="password" autocomplete="new-password" required>
        </div>
        <p class="auth-message" data-auth-message role="alert" hidden></p>
        <button type="submit" class="button primary-button">Create account</button>
      </form>
      <p>Already registered? <a href="login.html">Login</a></p>
    </section>
  </main>
  <script type="module" src="../scripts/auth.js"></script>
</body>
</html>
